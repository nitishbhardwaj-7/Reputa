name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Backend deps
        working-directory: backend
        run: npm ci --ignore-scripts --include=dev

      - name: Prisma client
        working-directory: backend
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Backend typecheck + build
        working-directory: backend
        run: npm run build

      - name: Frontend deps
        working-directory: frontend
        run: npm ci --include=dev

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Python scrapers compile
        run: python3 -m compileall -q backend/scripts

  deploy:
    name: Deploy to production
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /tmp/pub.txt 2>/tmp/keyerr.txt; then
            echo 'DEPLOY_SSH_KEY is not a valid private key:'; cat /tmp/keyerr.txt; exit 1
          fi
          echo "key fingerprint: $(ssh-keygen -lf /tmp/pub.txt | awk '{print $2}')"

      - name: Deploy
        run: |
          DEPLOY_USER=$(printf '%s' "${{ secrets.DEPLOY_USER }}" | tr -d '[:space:]')
          DEPLOY_HOST=$(printf '%s' "${{ secrets.DEPLOY_HOST }}" | tr -d '[:space:]')
          DOMAIN=$(printf '%s' "${{ secrets.DEPLOY_DOMAIN }}" | tr -d '[:space:]')
          for attempt in 1 2 3; do
            echo "deploy attempt $attempt"
            if ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=45 -o ServerAliveInterval=15 "${DEPLOY_USER}@${DEPLOY_HOST}" "DOMAIN='${DOMAIN}' bash /opt/reputa/deploy/deploy.sh"; then
              echo 'deploy succeeded'; exit 0
            fi
            echo "attempt $attempt failed; retrying in 30s"; sleep 30
          done
          echo 'all deploy attempts failed'; exit 1

      - name: Health check
        run: |
          DOMAIN=$(printf '%s' "${{ secrets.DEPLOY_DOMAIN }}" | tr -d '[:space:]')
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://${DOMAIN}/api/health" || true)
            if [ "$code" = "200" ]; then echo "healthy"; exit 0; fi
            echo "attempt $i: HTTP $code"; sleep 10
          done
          echo "health check failed"; exit 1
